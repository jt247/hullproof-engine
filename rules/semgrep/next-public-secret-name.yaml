rules:
  - id: hullproof-next-public-secret-name
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A variable with the NEXT_PUBLIC_ prefix is named like a service role key or a secret. Next.js copies every NEXT_PUBLIC_
      variable into the browser bundle, so the value is public to everyone who loads the site. Rename it without the prefix,
      read it only in server code, and rotate the key if it was ever deployed with the prefix.
    patterns:
      - pattern-either:
          - pattern: process.env.$V
          - pattern: process.env["$V"]
          - pattern: process.env['$V']
          - pattern: import.meta.env.$V
          - pattern: '{..., $V: $X, ...}'
          - pattern: '{..., "$V": $X, ...}'
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^NEXT_PUBLIC_.*(SERVICE_?ROLE|SERVICE_?KEY|SECRET|PRIVATE|ADMIN_?KEY|WEBHOOK_?SIGNING)
      - focus-metavariable: $V
    metadata:
      sec_ids: [SEC-SECRETS-001, SEC-SECRETS-003]
      severity_hint: CRITICAL
      confidence: MEDIUM
      note: >-
        Matches the variable name only, never the value. It also fires on a safe use, for example a name that holds a public
        identifier such as NEXT_PUBLIC_SECRET_SANTA_URL. Read the line. Env files are not scanned by this rule, see the
        gitleaks configuration and the SEC-SECRETS-001 recipe for them.
