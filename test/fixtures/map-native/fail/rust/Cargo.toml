[package]
name = "notes-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
internal-auth = { git = "https://github.com/acme/internal-auth" }
rand = "*"
hmac = "0.12"

[profile.release]
debug = true
overflow-checks = false
