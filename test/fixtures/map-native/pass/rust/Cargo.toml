[package]
name = "notes-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
internal-auth = "0.3.1"
rand = "0.8"
hmac = "0.12"

[profile.release]
debug = false

[lints.rust]
unsafe_code = "forbid"
